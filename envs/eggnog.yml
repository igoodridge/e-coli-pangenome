name: eggnog
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - bioconda::diamond=2.2.6
  - conda-forge::biopython=1.88
  - conda-forge::numpy=2.2.6
  - conda-forge::psutil
  - conda-forge::xlsxwriter
  - pip
  - pip:
    - git+https://github.com/eggnogdb/eggnog-mapper.git@b3757a6d226047527a729546e58ff530d76a5d7d
variables:
  PYTHONNOUSERSITE: "1" # only use env packages
